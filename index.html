<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Erith & District Artistic Swimming Testing Hub</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --accent:         #2a78d6;
    --accent-track:   #cde2fb;
    --accent-track-2: #e1e0d9;
    --flat-line:      #52514e;
    --chip-bg:        #f0efec;
    --chip-cap-bg:    #cde2fb;
    --chip-cap-text:  #184f95;
    --good:           #0ca30c;
    --warning:        #c98500;
    --critical:       #d03b3b;
    --neutral-mark:   #7a91ad;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --accent:         #3987e5;
      --accent-track:   #1c3a5c;
      --accent-track-2: #2c2c2a;
      --flat-line:      #c3c2b7;
      --chip-bg:        #26251f;
      --chip-cap-bg:    #1c3a5c;
      --chip-cap-text:  #9ec5f4;
      --good:           #0ca30c;
      --warning:        #fab219;
      --critical:       #e66767;
      --neutral-mark:   #93a9c4;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --accent:         #3987e5;
    --accent-track:   #1c3a5c;
    --accent-track-2: #2c2c2a;
    --flat-line:      #c3c2b7;
    --chip-bg:        #26251f;
    --chip-cap-bg:    #1c3a5c;
    --chip-cap-text:  #9ec5f4;
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #e66767;
    --neutral-mark:   #93a9c4;
  }

  * { box-sizing: border-box; }
  body { background: var(--page-plane); margin: 0; }

  .viz-root {
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    padding: 24px 20px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1040px; margin: 0 auto; }

  .site-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .site-logo { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .site-header-text { font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: .02em; }

  a { color: inherit; }

  .top-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .top-nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; }
  .top-nav a:hover { color: var(--accent); }
  .top-nav .crumb-sep { color: var(--text-muted); }
  .top-nav .current { color: var(--text-primary); }

  h1 { font-size: 21px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 700; margin: 28px 0 10px; }
  .date-chip {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-secondary);
    background: var(--chip-bg);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; max-width: 680px; }

  /* ---- home: test cards ---- */
  .test-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }
  .test-card {
    display: block;
    text-decoration: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color .1s ease;
  }
  .test-card:hover { border-color: var(--accent); }
  .test-card .icon { font-size: 22px; }
  .test-card .title { font-size: 15px; font-weight: 700; margin: 8px 0 3px; }
  .test-card .desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
  .test-card .meta { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

  /* ---- swimmer roster ---- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .search {
    flex: 1 1 220px;
    max-width: 320px;
    padding: 8px 12px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .search::placeholder { color: var(--text-muted); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .toggle-btn {
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .toggle-btn:hover { color: var(--text-primary); }

  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 6px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  .roster-link {
    display: block;
    padding: 8px 10px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .roster-link:hover { background: var(--chip-bg); color: var(--accent); }
  .roster-link.hidden { display: none; }
  .roster-empty { padding: 14px; font-size: 13px; color: var(--text-muted); grid-column: 1 / -1; }

  /* ---- shared board / row styles (test pages) ---- */
  .board {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  .board-scroll { max-height: 720px; overflow-y: auto; overflow-x: auto; border-radius: 12px; }

  .grid-row { display: grid; align-items: center; }
  .grid-row.gr-freestyle { grid-template-columns: 168px 1fr 82px; min-width: 620px; }
  .grid-row.gr-splits { grid-template-columns: 190px repeat(3, 1fr); min-width: 760px; }
  .grid-row.gr-onecol { grid-template-columns: 190px 1fr; min-width: 520px; }

  .head-row { position: sticky; top: 0; background: var(--surface-1); border-bottom: 1px solid var(--gridline); z-index: 2; }
  .head-cell { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: 10px 16px; }
  .head-cell.split-head { position: relative; text-align: center; }
  .head-flat-tick { position: absolute; left: 50%; top: 4px; transform: translateX(-1px); width: 2px; height: 8px; background: var(--flat-line); }
  .head-dates { position: relative; height: 34px; }
  .head-date { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  .head-delta { font-size: 11px; font-weight: 700; color: var(--text-muted); text-align: right; padding: 10px 14px 10px 6px; text-transform: uppercase; letter-spacing: .04em; }
  .head-bar { position: relative; height: 32px; }
  .head-tick { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 10.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
  .head-cutoff-line { position: absolute; right: 0; top: 4px; bottom: 4px; width: 2px; background: var(--flat-line); }

  .row { border-bottom: 1px solid var(--gridline); }
  .row:last-child { border-bottom: none; }
  .row:nth-child(even) { background: color-mix(in srgb, var(--gridline) 25%, transparent); }
  .row.hidden { display: none; }

  .name-cell { padding: 10px 16px; font-size: 13.5px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; min-width: 0; overflow: hidden; }
  .name-cell a { text-decoration: none; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .name-cell a:hover { color: var(--accent); }

  .chart-cell { position: relative; height: 46px; }
  .chart-cell svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .grid-line { stroke: var(--gridline); stroke-width: 1; }
  .trend-wrap { position: relative; width: 100%; height: 100%; }
  .val-label-html { position: absolute; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; font-weight: 600; }
  .dot-hit { fill: transparent; cursor: pointer; }

  .delta-cell { padding: 8px 14px 8px 6px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta-good { color: var(--good); }
  .delta-bad { color: var(--critical); }
  .delta-flat { color: var(--text-muted); font-weight: 600; }

  .split-cell { padding: 8px 16px; }
  .gauge { position: relative; height: 34px; }
  .gauge-track { position: absolute; top: 15px; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--accent-track); }
  .gauge-flat { position: absolute; left: 50%; top: 10px; width: 2px; height: 14px; background: var(--flat-line); transform: translateX(-1px); opacity: .55; }
  .gauge-dot { position: absolute; top: 8px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface-1); transform: translateX(-6px); }
  .gauge-label { position: absolute; top: 20px; font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  .gauge-missing { font-size: 12px; color: var(--text-muted); font-style: italic; padding-top: 6px; text-align: center; }

  .bar-cell { padding: 8px 16px; }
  .bar-wrap { position: relative; height: 26px; }
  .bar-track { position: absolute; top: 8px; left: 0; right: 0; height: 10px; border-radius: 5px; background: var(--accent-track-2); }
  .bar-fill { position: absolute; top: 8px; left: 0; height: 10px; border-radius: 5px; background: var(--accent); }
  .bar-cutoff-line { position: absolute; right: 0; top: 3px; bottom: 3px; width: 2px; background: var(--flat-line); opacity: .5; }
  .bar-value { position: absolute; top: -1px; font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cap-chip { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--chip-cap-text); background: var(--chip-cap-bg); padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .academy-emoji-badge { display: inline-block; font-size: 14px; line-height: 1; margin-left: 6px; vertical-align: middle; cursor: default; }
  .academy-emoji-dot { display: inline-block; font-size: 11px; line-height: 1; flex: none; margin-left: 4px; vertical-align: middle; cursor: default; }
  .squad-emoji-badge { display: inline-block; font-size: 14px; line-height: 1; margin-left: 6px; vertical-align: middle; cursor: default; }
  .squad-emoji-dot { display: inline-block; font-size: 11px; line-height: 1; flex: none; margin-left: 4px; vertical-align: middle; cursor: default; }

  /* Custom tooltip for the emoji markers above — a plain title="" attribute shows the browser's
     default cursor-only "help" hint on some systems instead of readable text, so we draw our own
     label on hover/focus/tap (via [data-tip]) instead of relying on native tooltip rendering. */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus::after, [data-tip]:active::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 7px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
    padding: 4px 9px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 20;
  }
  [data-tip]:hover::before, [data-tip]:focus::before, [data-tip]:active::before {
    content: "";
    position: absolute;
    left: calc(100% + 2px);
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: var(--text-primary);
    pointer-events: none;
    z-index: 20;
  }

  .legend, .scale-key, .color-key { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 11.5px; color: var(--text-muted); margin: 0 0 16px; padding: 10px 14px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
  .score-guide { margin: 0 0 18px; padding: 14px 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  .score-guide img { display: block; width: 100%; max-width: 760px; margin: 0 auto; border-radius: 8px; }
  .score-guide .score-guide-caption { margin: 10px 0 0; font-size: 11.5px; color: var(--text-muted); text-align: center; }
  .info-box { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 16px; padding: 12px 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; line-height: 1.55; max-width: 680px; }
  .info-box p { margin: 0 0 8px; }
  .info-box p:last-child { margin-bottom: 0; }
  .info-box ol, .info-box ul { margin: 6px 0 10px 18px; padding: 0; }
  .info-box li { margin: 2px 0; }
  .info-box strong { color: var(--text-primary); }
  .improve-box { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 20px; padding: 10px 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; line-height: 1.55; max-width: 560px; }
  .improve-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .improve-box h3 { margin: 0; font-size: 14px; color: var(--text-primary); }
  .improve-box p { margin: 12px 0; }
  .improve-body { display: none; }
  .improve-body.open { display: block; }
  .improve-toggle { flex: none; padding: 6px 10px; font-size: 12px; }
  .video-embed { position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 12px; }
  .video-embed:last-child { margin-bottom: 0; }
  .video-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .key-track { position: relative; width: 160px; height: 6px; border-radius: 3px; background: var(--accent-track); flex: none; }
  .key-flat { position: absolute; left: 50%; top: -4px; width: 2px; height: 14px; background: var(--flat-line); transform: translateX(-1px); }
  .key-track.gradient { background: linear-gradient(to right, var(--accent-track-2), var(--accent)); }
  .key-cutoff { position: absolute; right: 0; top: -4px; width: 2px; height: 14px; background: var(--flat-line); }

  table.table-view { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.table-view th, table.table-view td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  table.table-view th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); position: sticky; top: 0; background: var(--surface-1); }
  table.table-view td.num { font-variant-numeric: tabular-nums; }
  table.table-view td.dash { color: var(--text-muted); font-style: italic; }

  .note { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }

  /* ---- swimmer profile ---- */
  .profile-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .profile-head h1 { margin: 0; }

  .profile-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .profile-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .profile-card h3 { margin: 0 0 4px; font-size: 14px; }
  .profile-card .p-desc { font-size: 11.5px; color: var(--text-muted); margin: 0 0 12px; }
  .profile-card .p-link { display: inline-block; margin-top: 10px; font-size: 11.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .profile-card .p-link:hover { text-decoration: underline; }
  .profile-empty { font-size: 12.5px; color: var(--text-muted); font-style: italic; }

  .split-row-single { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .split-row-single .s-label { width: 84px; flex: none; font-size: 11.5px; color: var(--text-secondary); }
  .split-row-single .gauge { flex: 1; }
</style>

  // home page banner never needs a separate manual update when a new session's results are added) ----------
  function parseSessionDateLabel(label) {
    var m = label.match(/(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s*(\d{4})?/);
    if (!m) return null;
    var months = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    var month = months[m[2]];
    if (month === undefined) return null;
    // The testing hub covers a single season (2026); older date labels that were written without
    // a year (e.g. early Freestyle sessions) default to that.
    return new Date(m[3] ? +m[3] : 2026, month, +m[1]);
  }

    });
    return best || "Not yet recorded";

    var box = el("div", "score-guide");

  function nameHref(n) { return "#swimmer/" + encodeURIComponent(n); }
  function testHref(id) { return "#test/" + id; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  // ---------- freestyle row (shared by test page + profile card) ----------
  // Value labels are plain HTML overlaid on top of the SVG, not SVG <text> —
  // the SVG stretches non-uniformly (preserveAspectRatio="none", 100 wide viewBox
  // mapped onto a much wider element), which distorts native SVG text horizontally
  // and makes it blurry/hard to read. HTML text isn't affected by that stretch.
  function buildFreestyleRowSVG(points, opts) {
    opts = opts || {};
    var h = opts.height || 46;
    var xPos = opts.xPos || [8, 22, 36, 50, 64, 78, 92];
    var fmtFn = opts.fmtFn || fmt;
    // Most tests are lower-is-better (times). A hold-time test like Plank is the opposite —
    // longer is better — so higherIsBetter flips which direction counts as an improvement,
    // for both the line/dot coloring and which value is plotted at the top of the chart.
    var higherIsBetter = !!opts.higherIsBetter;
    // capAt marks a value that hit the test's time cap (e.g. Plank/Wall Sit stopped at 3:00) —
    // shown with a small CAP chip next to the value since the swimmer may have gone longer.
    var capAt = opts.capAt;
    // dotColorFn colors every dot by its own absolute value (e.g. Splits: red/amber/green by
    // score) instead of the default relative-to-previous-point coloring used for every other dot.
    var dotColorFn = opts.dotColorFn;
    // sameIsGood treats an unchanged result between two sessions as a good (green) segment
    // rather than neutral — appropriate for a test like Splits where holding steady is a fine
    // outcome, not "no progress".
    var sameIsGood = !!opts.sameIsGood;
    var wrap = document.createElement("div");
    wrap.className = "trend-wrap";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 100 " + h);
    svg.setAttribute("preserveAspectRatio", "none");

    xPos.forEach(function (x) {
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", x); line.setAttribute("x2", x);
      line.setAttribute("y1", 4); line.setAttribute("y2", h - 4);
      line.setAttribute("class", "grid-line");
      line.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(line);
    });

    var secs = points.map(function (p) { return p.sec; });
    var min = Math.min.apply(null, secs), max = Math.max.apply(null, secs);
    var top = 8, bottom = h - 12, plotH = bottom - top;
    function yFor(sec) {
      if (max === min) return top + plotH / 2;
      var frac = (sec - min) / (max - min);
      if (higherIsBetter) frac = 1 - frac; // best result plotted at the top either way
      return top + frac * plotH;

    var improved = higherIsBetter ? last > first : last < first;

    function segColor(prevSec, sec) {

      // the same as the previous capped result — so it's green rather than the usual "unchanged" neutral.
      if (capAt !== undefined && prevSec >= capAt && sec >= capAt) return "var(--good)";

      var seg = document.createElementNS(svgNS, "line");
      seg.setAttribute("x1", coords[i - 1].x); seg.setAttribute("y1", coords[i - 1].y);
      seg.setAttribute("x2", coords[i].x); seg.setAttribute("y2", coords[i].y);
      seg.setAttribute("stroke", segColor(coords[i - 1].sec, coords[i].sec));
      seg.setAttribute("stroke-width", "2");
      seg.setAttribute("stroke-linecap", "round");
      seg.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(seg);
    }

    coords.forEach(function (c, i) {
      // A capped result is green on its own, even as the very first point (no previous segment to compare against).
      var atCap = capAt !== undefined && c.sec >= capAt;
      var dotColor = dotColorFn ? dotColorFn(c.sec) : (atCap ? "var(--good)" : (i === 0 ? "var(--neutral-mark)" : segColor(coords[i - 1].sec, c.sec)));
      var dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", c.x); dot.setAttribute("cy", c.y);
      dot.setAttribute("r", h > 46 ? 3.2 : 2.6);
      dot.setAttribute("fill", dotColor);
      dot.setAttribute("stroke", "var(--surface-1)");
      dot.setAttribute("stroke-width", "1.2");
      svg.appendChild(dot);
    });

    wrap.appendChild(svg);

    var above = top + plotH / 2; // points above the mid-line get their label below, and vice versa
    coords.forEach(function (c) {
      var label = document.createElement("div");
      label.className = "val-label-html";
      label.style.left = c.x + "%";
      label.style.top = ((c.y / h) * 100) + "%";
      label.style.fontSize = h > 46 ? "11.5px" : "10.5px";
      label.style.transform = "translate(-50%, " + (c.y < above ? "5px" : "calc(-100% - 5px)") + ")";
      if (capAt !== undefined && c.sec >= capAt) {
        label.innerHTML = fmtFn(c.sec) + " <span class='cap-chip' style='margin-left:3px;'>CAP</span>";
      } else {
        label.textContent = fmtFn(c.sec);
      }
      wrap.appendChild(label);
    });

    return { el: wrap, trend: trend, first: first, last: last };
  }

  function pointsFor(dataObj, name) {
    var raw = dataObj[name];
    if (!raw) return null;
    return Object.keys(raw).map(function (k) { return { idx: +k, sec: raw[k] }; })

  // floor so each date label (e.g. "SUN 27 SEP") has ~100px of breathing room; this grows

  function gridRowMinWidth(sessionCount) {

  // ---------- back flexibility gauge (1-8 scale, like Splits) ----------
  // 1 = 50cm apart ... 5 = 10cm apart, 6 = fingers & toes touching, 7 = 5cm past heels, 8 = 10cm past heels
  var BACK_FLEX_CM = { 1: 50, 2: 40, 3: 30, 4: 20, 5: 10, 6: 0, 7: -5, 8: -10 };
  var BACK_FLEX_DOMAIN_MIN = 1, BACK_FLEX_DOMAIN_MAX = 8;
  function backFlexPosPct(score) { return ((score - BACK_FLEX_DOMAIN_MIN) / (BACK_FLEX_DOMAIN_MAX - BACK_FLEX_DOMAIN_MIN)) * 100; }
  var BACK_FLEX_TOUCH_PCT = backFlexPosPct(6);
  function describeBackFlex(score) {
    var cm = BACK_FLEX_CM[score];

      bxCard.appendChild(buildSplitGauge(BOX_SPLIT[name]));
    }
    var bxLink = document.createElement("a"); bxLink.className = "p-link"; bxLink.href = testHref("box-split"); bxLink.textContent = "See full Box Split tracker →";
    bxCard.appendChild(bxLink);
    cards.appendChild(bxCard);

    // Plank card
    var pkCard = el("div", "profile-card");
    pkCard.appendChild(el("h3", null, "Plank Time"));
    var pkPoints = plankPointsFor(name);
    if (!pkPoints) {
      pkCard.appendChild(el("p", "profile-empty", "Not recorded."));
    } else {
      pkCard.appendChild(el("p", "p-desc", "Longer is better. Capped at 3:00."));
      var pkChartWrap = el("div", "chart-cell"); pkChartWrap.style.height = "70px";
      var pkBuilt = buildFreestyleRowSVG(pkPoints, { height: 70, xPos: [25, 75], higherIsBetter: true, capAt: 180 });
      pkChartWrap.appendChild(pkBuilt.el);
      pkCard.appendChild(pkChartWrap);
    }
    var pkLink = document.createElement("a"); pkLink.className = "p-link"; pkLink.href = testHref("plank"); pkLink.textContent = "See full Plank Time tracker →";
    pkCard.appendChild(pkLink);
    cards.appendChild(pkCard);

    // Wall sit card
    var wsCard = el("div", "profile-card");
    wsCard.appendChild(el("h3", null, "Wall Sit Time"));
    if (WALLSIT[name] === undefined) {
      wsCard.appendChild(el("p", "profile-empty", "Not recorded."));
    } else {
      wsCard.appendChild(el("p", "p-desc", "Longer is better. Capped at 3:00."));
      wsCard.appendChild(buildTimeBar(WALLSIT[name], 180, holdTimeColor));
    }
    var wsLink = document.createElement("a"); wsLink.className = "p-link"; wsLink.href = testHref("wallsit"); wsLink.textContent = "See full Wall Sit tracker →";
    wsCard.appendChild(wsLink);
    cards.appendChild(wsCard);

    app.appendChild(cards);
  }

  // ---------- router ----------
  function route() {
    var hash = location.hash.replace(/^#/, "");
    if (!hash) { renderHome(); return; }
    var parts = hash.split("/");
    if (parts[0] === "test" && parts[1]) {
      if (parts[1] === "freestyle") return renderFreestyleTest();
      if (parts[1] === "sprint") return renderSprintTest();
      if (parts[1] === "gbhypoxic") return renderGBHypoxicTest();
      if (parts[1] === "gbkickset") return renderGBKickSetTest();
      if (parts[1] === "backflex") return renderBackFlexTest();
      if (parts[1] === "right-split") return renderRightSplitTest();
      if (parts[1] === "left-split") return renderLeftSplitTest();
      if (parts[1] === "box-split") return renderBoxSplitTest();
      if (parts[1] === "plank") return renderPlankTest();
      if (parts[1] === "wallsit") return renderWallSitTest();
    }
    if (parts[0] === "swimmer" && parts[1]) {
      return renderSwimmer(decodeURIComponent(parts.slice(1).join("/")));
    }
    renderHome();
  }

  window.addEventListener("hashchange", function () { window.scrollTo(0, 0); route(); });
  route();
})();
</script>

</body></html>
